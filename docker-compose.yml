services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_FULL_STACK: ${INSTALL_FULL_STACK:-false}
    working_dir: /app/backend
    ports:
      - "8000:8000"
    environment:
      SAFEHER_DB_PATH: /app/backend/var/safeher_local.db
    env_file:
      - path: ./backend/.env.example
      - path: ./backend/.env
        required: false
    volumes:
      - safeher-data:/app/backend/var
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3

volumes:
  safeher-data:
